  color:var(--text);
  font-family:Inter, system-ui, sans-serif;
}

.font-display{
  font-family:"Space Grotesk", Inter, system-ui, sans-serif;
}

.glass{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
}

.neon{
  box-shadow:0 0 0 1px rgba(168,85,247,.45), 0 18px 55px rgba(168,85,247,.18);
}

.text-gradient{
  background:linear-gradient(90deg,#fff 5%,#A855F7 42%,#22D3EE 78%,#A3E635 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-grid{
  background-image:linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at center, black 35%, transparent 78%);
          mask-image:radial-gradient(ellipse at center, black 35%, transparent 78%);
}

@keyframes marquee{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

.marquee{
  animation:marquee 24s linear infinite;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-10px) rotate(1deg);
  }
}

.floaty{
  animation:floaty 5s ease-in-out infinite;
}

@keyframes pulseGlow{
  0%,100%{
    opacity:.55;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.12);
  }
}

.pulse-glow{
  animation:pulseGlow 3.2s ease-in-out infinite;
}

@keyframes shine{
  from{
    transform:translateX(-120%) skewX(-18deg);
  }

  to{
    transform:translateX(240%) skewX(-18deg);
  }
}

.shine:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:38%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  animation:shine 3.4s ease-in-out infinite;
}

.reveal{
  animation:reveal .7s ease both;
}

@keyframes reveal{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

input,select{
  color-scheme:dark;
}

input:focus,select:focus{
  outline:2px solid #A855F7;
  outline-offset:2px;
}

::-moz-selection{
  background:#A855F7;
  color:white;
}

::selection{
  background:#A855F7;
  color:white;
}

.hover\:-translate-y-1\.5:hover{
  --tw-translate-y: -0.375rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-\[\#22D3EE\]:hover{
  --tw-border-opacity: 1;
  border-color: rgb(34 211 238 / var(--tw-border-opacity, 1));
}

.hover\:border-\[\#22D3EE\]\/60:hover{
  border-color: rgb(34 211 238 / 0.6);
}

.hover\:border-\[\#A855F7\]\/70:hover{
  border-color: rgb(168 85 247 / 0.7);
}

.hover\:bg-\[\#22D3EE\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(34 211 238 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#A3E635\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(163 230 53 / var(--tw-bg-opacity, 1));
}

.hover\:bg-white:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(255 255 255 / var(--tw-bg-opacity, 1));
}

.hover\:text-black:hover{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:block{
    display: block;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-16{
    padding-top: 4rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-\[13px\]{
    font-size: 13px;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:block{
    display: block;
  }

  .lg\:flex{
    display: flex;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-5{
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.15fr_\.85fr\]{
    grid-template-columns: 1.15fr .85fr;
  }

  .lg\:grid-cols-\[1\.1fr_\.9fr\]{
    grid-template-columns: 1.1fr .9fr;
  }

  .lg\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .lg\:pb-20{
    padding-bottom: 5rem;
  }
}

@media (min-width: 1280px){
  .xl\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
